<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sector Heads</title><style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1115;color:#e8eaed}
header{padding:20px 20px 8px;max-width:1200px;margin:0 auto}
.hrow{display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px;margin:0}
#lockBtn{background:#1d2129;color:#e8eaed;border:1px solid #333a45;border-radius:8px;padding:6px 14px;cursor:pointer}
.sub{color:#9aa3af;font-size:13px;margin-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;max-width:1200px;margin:0 auto}
.tab{background:#1d2129;color:#c7cdd6;border:1px solid #333a45;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.tab.on{background:#2f6fed;color:#fff;border-color:#2f6fed}
.controls{max-width:1200px;margin:0 auto;padding:0 20px 8px}
#search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #333a45;background:#171a20;color:#e8eaed;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:transparent;color:#9aa3af;border:1px solid #333a45;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
.chip.on{color:#fff;border-color:#2f6fed;background:#22345c}
.layout{display:flex;gap:20px;max-width:1200px;margin:0 auto;padding:8px 20px 40px;align-items:flex-start}
main{flex:1;min-width:0}
aside{width:320px;flex-shrink:0}
@media(max-width:860px){.layout{flex-direction:column}aside{width:100%}}
.card{background:#171a20;border:1px solid #262b34;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:18px;margin:8px 0}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{background:#262b34;color:#c7cdd6;border-radius:6px;padding:2px 8px;font-size:11px}
.badge.sec{background:#22345c;color:#bcd0ff}
.date{color:#9aa3af;font-size:12px;margin-left:auto}
.body{font-size:14.5px;line-height:1.55;color:#d6dade}
.body h3{font-size:16px;margin:14px 0 6px}
.body h4{font-size:14.5px;margin:12px 0 4px}
.body p{margin:8px 0}
.body ul{margin:8px 0;padding-left:20px}
.tick{color:#9aa3af;font-size:12px;margin-top:10px}
.tblwrap{overflow-x:auto}
.ptable{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.ptable th,.ptable td{border:1px solid #2b313b;padding:5px 8px;text-align:left;white-space:nowrap}
.ptable th{background:#1d2129}
.pos{color:#4ade80}.neg{color:#f87171}
.rail{background:#171a20;border:1px solid #262b34;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.rail h3{margin:0 0 10px;font-size:15px}
.thsec{font-weight:600;margin-top:10px;font-size:13px;color:#bcd0ff}
.theses{font-size:13px;line-height:1.5;color:#c7cdd6}
.theses p{margin:6px 0}
.ev{font-size:13px;padding:5px 0;border-bottom:1px solid #22262e}
.ev:last-child{border-bottom:none}
.evd{color:#9aa3af;font-size:12px}
.muted{color:#9aa3af;font-size:13px}
.empty{color:#9aa3af;padding:30px;text-align:center}
#gate{max-width:360px;margin:14vh auto;background:#171a20;border:1px solid #262b34;border-radius:16px;padding:28px;text-align:center}
#gate input{width:100%;padding:11px;border-radius:10px;border:1px solid #333a45;background:#0f1115;color:#e8eaed;font-size:16px;margin:14px 0}
#gate button{width:100%;padding:11px;border-radius:10px;border:none;background:#2f6fed;color:#fff;font-size:15px;cursor:pointer}
#gateErr{color:#f87171;font-size:13px;min-height:18px}
</style></head><body>

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function normSector(s) { return s === 'Chief Investment Officer' ? 'Director of Research' : s; }

function inlineMd(s) {
  return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}

function renderBody(md) {
  if (!md) return '';
  var lines = String(md).split('\n');
  var out = [], i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line)) {
      var rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
      var cells = rows.map(function (r) { return r.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); });
      cells = cells.filter(function (r) { return !r.every(function (c) { return /^:?-{2,}:?$/.test(c); }); });
      if (cells.length) {
        var h = '<div class="tblwrap"><table class="ptable"><thead><tr>' + cells[0].map(function (c) { return '<th>' + inlineMd(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
        for (var r = 1; r < cells.length; r++) h += '<tr>' + cells[r].map(function (c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>';
        out.push(h + '</tbody></table></div>');
      }
      continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    var m;
    if ((m = line.match(/^###\s+(.*)/))) { out.push('<h4>' + inlineMd(m[1]) + '</h4>'); i++; continue; }
    if ((m = line.match(/^##\s+(.*)/))) { out.push('<h3>' + inlineMd(m[1]) + '</h3>'); i++; continue; }
    if ((m = line.match(/^#\s+(.*)/))) { out.push('<h3>' + inlineMd(m[1]) + '</h3>'); i++; continue; }
    if (/^\s*[-*]\s+/.test(line)) {
      var items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
      out.push('<ul>' + items.map(function (t) { return '<li>' + inlineMd(t) + '</li>'; }).join('') + '</ul>');
      continue;
    }
    var para = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*\|/.test(lines[i]) && !/^#{1,3}\s/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i])) { para.push(lines[i]); i++; }
    out.push('<p>' + inlineMd(para.join(' ')) + '</p>');
  }
  return out.join('\n');
}

function postTs(p) {
  if (p.ts) return p.ts;
  var t = Date.parse(p.date || '');
  return isNaN(t) ? 0 : t;
}

function render() {
  var app = document.getElementById('app');
  var sectorsPresent = {};
  DATA.posts.forEach(function (p) { sectorsPresent[normSector(p.sector)] = true; });
  var tabs = TAB_ORDER.filter(function (t) { return t === 'All Updates' || sectorsPresent[t] || (DATA.sectors || []).some(function (s) { return (typeof s === 'string' ? s : s.name) === t; }); });
  if (tabs.indexOf(curTab) < 0) curTab = 'All Updates';

  var types = ['All Types'];
  DATA.posts.forEach(function (p) { if (types.indexOf(p.type) < 0) types.push(p.type); });

  var posts = DATA.posts.filter(function (p) {
    if (curTab !== 'All Updates' && normSector(p.sector) !== curTab) return false;
    if (curType !== 'All Types' && p.type !== curType) return false;
    if (curSearch) {
      var hay = (p.title + ' ' + p.body + ' ' + (p.tickers || '') + ' ' + p.sector).toLowerCase();
      if (hay.indexOf(curSearch.toLowerCase()) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return postTs(b) - postTs(a); });

  var h = '';
  h += '<header><div class="hrow"><h1>Sector Heads</h1><button id="lockBtn">Lock</button></div>';
  h += '<div class="sub">Content as of ' + esc(DATA.generated_label || '') + ' &middot; ' + DATA.posts.length + ' posts &middot; ' + DATA.events.length + ' events</div></header>';
  h += '<nav class="tabs">' + tabs.map(function (t) { return '<button class="tab' + (t === curTab ? ' on' : '') + '" data-tab="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</nav>';
  h += '<div class="controls"><input id="search" type="search" placeholder="Search posts, tickers..." value="' + esc(curSearch) + '">';
  h += '<div class="chips">' + types.map(function (t) { return '<button class="chip' + (t === curType ? ' on' : '') + '" data-type="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div></div>';
  h += '<div class="layout"><main>';
  if (!posts.length) h += '<div class="empty">No posts match.</div>';
  posts.forEach(function (p) {
    h += '<article class="card"><div class="meta"><span class="badge sec">' + esc(normSector(p.sector)) + '</span><span class="badge">' + esc(p.type) + '</span><span class="date">' + esc(p.date) + '</span></div>';
    h += '<h2>' + esc(p.title) + '</h2><div class="body">' + renderBody(p.body) + '</div>';
    if (p.tickers) h += '<div class="tick">' + esc(p.tickers) + '</div>';
    h += '</article>';
  });
  h += '</main><aside>' + railHtml() + '</aside></div>';
  app.innerHTML = h;

  document.getElementById('lockBtn').onclick = function () { location.reload(); };
  document.getElementById('search').oninput = function (e) { curSearch = e.target.value; renderKeepFocus(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.onclick = function () { curTab = b.getAttribute('data-tab'); render(); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-type]'), function (b) { b.onclick = function () { curType = b.getAttribute('data-type'); render(); }; });
}

function renderKeepFocus() {
  var v = curSearch;
  render();
  var s = document.getElementById('search');
  s.focus();
  s.setSelectionRange(v.length, v.length);
}

function thesesHtml(v) {
  // content.json stores theses as a list of {ticker, text} per sector (older builds used a string).
  if (!v) return '';
  if (typeof v === 'string') return v.trim() ? '<div class="theses">' + renderBody(v) + '</div>' : '';
  if (Object.prototype.toString.call(v) === '[object Array]') {
    var items = v.filter(function (x) { return x && x.text && String(x.text).trim(); });
    if (!items.length) return '';
    return items.map(function (x) {
      return (x.ticker ? '<div class="thsec">' + esc(x.ticker) + '</div>' : '') + '<div class="theses">' + renderBody(x.text) + '</div>';
    }).join('');
  }
  return '';
}

function railHtml() {
  var h = '';
  var sector = curTab === 'All Updates' ? null : curTab;
  // Theses
  h += '<section class="rail"><h3>Theses</h3>';
  if (sector) {
    var t = null;
    Object.keys(DATA.theses || {}).forEach(function (k) { if (normSector(k) === sector) t = DATA.theses[k]; });
    var th = thesesHtml(t);
    h += th ? th : '<div class="muted">No theses on file yet.</div>';
  } else {
    var any = false;
    TAB_ORDER.forEach(function (s) {
      Object.keys(DATA.theses || {}).forEach(function (k) {
        if (normSector(k) === s) {
          var hh = thesesHtml(DATA.theses[k]);
          if (hh) { any = true; h += '<div class="thsec">' + esc(s) + '</div>' + hh; }
        }
      });
    });
    if (!any) h += '<div class="muted">No theses on file yet.</div>';
  }
  h += '</section>';
  // Events
  var evs = (DATA.events || []).filter(function (e) { return !sector || normSector(e.sector) === sector; })
    .slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
  h += '<section class="rail"><h3>Upcoming events</h3>';
  if (!evs.length) h += '<div class="muted">No events.</div>';
  evs.slice(0, 40).forEach(function (e) {
    h += '<div class="ev"><span class="evd">' + esc(e.date) + '</span> <span class="evt">' + esc(e.event) + '</span>' + (e.ticker ? ' <span class="badge">' + esc(e.ticker) + '</span>' : '') + (sector ? '' : ' <span class="muted">' + esc(normSector(e.sector)) + '</span>') + '</div>';
  });
  h += '</section>';
  // Prices
  if (DATA.prices && DATA.prices.targets && DATA.prices.targets.length) {
    var rows = DATA.prices.targets;
    if (sector && SECTOR_TICKERS[sector]) rows = rows.filter(function (r) { return SECTOR_TICKERS[sector].indexOf(r.ticker) >= 0; });
    if (!sector || curTab === 'Portfolio Manager' || curTab === 'Director of Research') rows = rows.slice().sort(function (a, b) { return b.diff - a.diff; });
    if (rows.length) {
      h += '<section class="rail"><h3>Target prices</h3><div class="muted">' + esc(DATA.prices.asof || '') + '</div>';
      h += '<table class="ptable"><thead><tr><th>Ticker</th><th>Target</th><th>Current</th><th>% diff</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        h += '<tr><td>' + esc(r.ticker) + '</td><td>' + Math.round(r.target) + '</td><td>' + Math.round(r.current) + '</td><td class="' + (r.diff >= 0 ? 'pos' : 'neg') + '">' + (r.diff >= 0 ? '+' : '') + Math.round(r.diff) + '%</td></tr>';
      });
      h += '</tbody></table></section>';
    }
    if (DATA.prices.trading && DATA.prices.trading.length) {
      var trows = DATA.prices.trading;
      if (sector && SECTOR_TICKERS[sector]) trows = trows.filter(function (r) { return SECTOR_TICKERS[sector].indexOf(r.ticker) >= 0; });
      if (trows.length) {
        var fmtP = function (v) { return (v === null || v === undefined) ? '—' : ((v >= 0 ? '+' : '') + Math.round(v) + '%'); };
        h += '<section class="rail"><h3>Trading history</h3>';
        h += '<table class="ptable"><thead><tr><th>Ticker</th><th>1W</th><th>1M</th><th>3M</th><th>6M</th><th>12M</th></tr></thead><tbody>';
        trows.forEach(function (r) {
          h += '<tr><td>' + esc(r.ticker) + '</td><td class="' + (r.w >= 0 ? 'pos' : 'neg') + '">' + fmtP(r.w) + '</td><td class="' + (r.m >= 0 ? 'pos' : 'neg') + '">' + fmtP(r.m) + '</td><td class="' + (r.m3 >= 0 ? 'pos' : 'neg') + '">' + fmtP(r.m3) + '</td><td class="' + (r.m6 >= 0 ? 'pos' : 'neg') + '">' + fmtP(r.m6) + '</td><td class="' + (r.m12 >= 0 ? 'pos' : 'neg') + '">' + fmtP(r.m12) + '</td></tr>';
        });
        h += '</tbody></table></section>';
      }
    }
  }
  return h;
}

async function unlock(pw) {
  var err = document.getElementById('gateErr');
  try {
    var payload = window.__PAYLOAD__;
    var salt = Uint8Array.from(atob(payload.s), function (c) { return c.charCodeAt(0); });
    var iv = Uint8Array.from(atob(payload.i), function (c) { return c.charCodeAt(0); });
    var ct = Uint8Array.from(atob(payload.c), function (c) { return c.charCodeAt(0); });
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: payload.k, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    DATA = JSON.parse(new TextDecoder().decode(pt));
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = '';
    render();
  } catch (e) {
    err.textContent = 'Wrong password.';
  }
}

document.getElementById('gateForm').addEventListener('submit', function (e) {
  e.preventDefault();
  unlock(document.getElementById('pw').value);
});
</script>
